[package]
name = "pv-desktop-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
gtk = { package = "gtk4", version = "0.9" }
maruzzella_sdk = { path = "../../../maruzzella/maruzzella_sdk" }
pv-core = { path = "../pv-core" }
pv-data = { path = "../pv-data" }
pv-desktop-core = { path = "../pv-desktop-core" }
pv-model = { path = "../pv-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
